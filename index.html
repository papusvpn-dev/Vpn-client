<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiteClient VPN</title>
    <style>
        /* Стиль в точном соответствии с аватаром RiteClient */
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* Неоновые фоновые свечения из углов, как на аватарке */
        body::before, body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 81, 255, 0.4) 0%, rgba(0,0,0,0) 70%);
            filter: blur(50px);
            z-index: 1;
        }
        body::before { top: -50px; right: -50px; background: radial-gradient(circle, rgba(138, 43, 226, 0.3) 0%, rgba(0,0,0,0) 70%); }
        body::after { bottom: -100px; left: -100px; }

        .container {
            width: 100%;
            max-width: 380px;
            background: rgba(13, 15, 24, 0.75);
            border: 1px solid rgba(0, 81, 255, 0.2);
            padding: 35px 25px;
            border-radius: 28px;
            backdrop-filter: blur(20px);
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            z-index: 2;
        }

        /* Светящийся неоновый заголовок */
        h1 { 
            font-size: 28px; 
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 30px; 
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff 30%, #00d2ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }
        
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }
        
        input {
            width: 100%;
            padding: 16px 55px 16px 18px;
            background: rgba(5, 7, 12, 0.9);
            border: 1px solid #1e293b;
            border-radius: 16px;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s ease;
        }
        /* Синее неоновое свечение при выборе поля */
        input:focus { 
            border-color: #0051ff; 
            box-shadow: 0 0 15px rgba(0, 81, 255, 0.4);
        }
        
        .paste-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .paste-btn:active { transform: translateY(-50%) scale(0.9); }

        .stats-card {
            display: flex;
            justify-content: space-around;
            background: rgba(14, 20, 35, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 18px;
            margin-bottom: 35px;
        }
        .stat-box { display: flex; flex-direction: column; }
        .stat-label { font-size: 11px; color: #64748b; margin-bottom: 6px; font-weight: 600; letter-spacing: 0.5px; }
        .stat-value { font-size: 15px; font-weight: 700; transition: color 0.3s; }
        
        /* Кнопка — точная копия эффекта свечения буквы R */
        .connect-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: linear-gradient(135deg, #0051ff 0%, #a855f7 100%);
            color: white;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 1.5px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 81, 255, 0.5), 0 0 50px rgba(168, 85, 247, 0.3);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        .connect-btn:hover {
            box-shadow: 0 0 40px rgba(0, 81, 255, 0.7), 0 0 70px rgba(168, 85, 247, 0.5);
        }

        /* Красное свечение при отключении */
        .connect-btn.connected {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.6);
            border-color: rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>RITE CLIENT</h1>

    <!-- Ввод подписки -->
    <div class="input-group">
        <input type="text" id="configInput" placeholder="Вставьте вашу ссылку...">
        <button class="paste-btn" onclick="pasteFromClipboard()">📋</button>
    </div>

    <!-- Статус и Пинг -->
    <div class="stats-card">
        <div class="stat-box">
            <span class="stat-label">СОЕДИНЕНИЕ</span>
            <span class="stat-value" id="statusVal" style="color: #64748b;">ОТКЛЮЧЕН</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">ЗАДЕРЖКА</span>
            <span class="stat-value" id="pingVal" style="color: #a855f7;">—</span>
        </div>
    </div>

    <!-- Главная круглая кнопка -->
    <button class="connect-btn" id="connectBtn" onclick="toggleConnection()">ПОДКЛЮЧИТЬ</button>
</div>

<script>
    let isConnected = false;

    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('configInput').value = text;
            measurePing();
        } catch (err) {
            alert('Зажмите поле пальцем и выберите "Вставить"');
        }
    }

    function measurePing() {
        const pingDisplay = document.getElementById('pingVal');
        pingDisplay.innerText = 'Замер...';
        pingDisplay.style.color = '#00d2ff';

        setTimeout(() => {
            // Симулируем точный пинг для красоты интерфейса
            const fakePing = Math.floor(Math.random() * (65 - 25 + 1)) + 25;
            pingDisplay.innerText = `${fakePing} ms`;
            pingDisplay.style.color = '#00e676';
        }, 800);
    }

    function toggleConnection() {
        const btn = document.getElementById('connectBtn');
        const status = document.getElementById('statusVal');
        const config = document.getElementById('configInput').value.trim();

        if (!config) {
            alert('Сначала вставьте скопированную подписку!');
            return;
        }

        if (!isConnected) {
            isConnected = true;
            btn.innerText = 'ОТКЛЮЧИТЬ';
            btn.classList.add('connected');
            status.innerText = 'ПОДКЛЮЧЕН';
            status.style.color = '#00e676';
        } else {
            isConnected = false;
            btn.innerText = 'ПОДКЛЮЧИТЬ';
            btn.classList.remove('connected');
            status.innerText = 'ОТКЛЮЧЕН';
            status.style.color = '#64748b';
        }
    }
</script>
</body>
</html>
